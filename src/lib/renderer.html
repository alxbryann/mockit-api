<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8">
  <style>* { margin: 0; padding: 0; } body { background: #000; overflow: hidden; } canvas { display: block; }</style>
  <script type="importmap">
  {
    "imports": {
      "three": "/vendor/three/build/three.module.js",
      "three/addons/": "/vendor/three/examples/jsm/"
    }
  }
  </script>
</head>
<body>
<canvas id="c"></canvas>
<script type="module">
import * as THREE from 'three'
import { RoundedBoxGeometry } from 'three/addons/geometries/RoundedBoxGeometry.js'
import { RGBELoader } from 'three/addons/loaders/RGBELoader.js'

// ── Phone dims (Phone.tsx) ────────────────────────────────────────────────
const W = 7.06, H = 14.66, D = 0.78, CORNER = 1.0
const SCREEN_W = 6.3, SCREEN_H = 13.5, SCREEN_OPENING_CORNER_R = 0.35
const BODY_FRONT_Z = D / 2
const SCREEN_Z = BODY_FRONT_Z + 0.024
const SCREEN_PLATFORM_DEPTH = 0.07
const SCREEN_PLATFORM_CENTER_Z = SCREEN_Z - 0.01 - SCREEN_PLATFORM_DEPTH / 2
const BEZEL_Z = BODY_FRONT_Z + 0.03

// ── Texture helpers (deviceFrameTextures.ts) ──────────────────────────────
function clamp01(v) { return Math.min(1, Math.max(0, v)) }
function grain01(x, y) {
  const n = Math.sin(x * 127.1 + y * 311.7) * 43758.5453123
  return n - Math.floor(n)
}
function makeCanvasTexture(putPixels, repeatU, repeatV) {
  const size = 512
  const c = document.createElement('canvas')
  c.width = c.height = size
  const ctx = c.getContext('2d')
  putPixels(ctx, size)
  const tex = new THREE.CanvasTexture(c)
  tex.wrapS = tex.wrapT = THREE.RepeatWrapping
  tex.repeat.set(repeatU, repeatV)
  tex.anisotropy = 16
  tex.colorSpace = THREE.NoColorSpace
  tex.needsUpdate = true
  return tex
}

const _texCache = {}
function getFrameMaps(variant) {
  if (_texCache[variant]) return _texCache[variant]
  const baseRough = variant === 'titanium' ? 0.58 : 0.46
  const brushAmp  = variant === 'titanium' ? 0.045 : 0.068
  const fineAmp   = variant === 'titanium' ? 0.028 : 0.034
  const normalMul = variant === 'titanium' ? 1.15 : 1.35
  const brushNx   = variant === 'titanium' ? 48 : 56

  const roughnessMap = makeCanvasTexture((ctx, size) => {
    const img = ctx.createImageData(size, size)
    for (let y = 0; y < size; y++) {
      const ny = y / size
      for (let x = 0; x < size; x++) {
        const nx = x / size
        const i = (y * size + x) * 4
        const v = clamp01(baseRough + Math.sin(nx * Math.PI * brushNx + ny * Math.PI * 3) * brushAmp
          + (grain01(x, y) - 0.5) * fineAmp + Math.sin(nx * Math.PI * 6 + ny * Math.PI * 14) * 0.012)
        const b = Math.round(v * 255)
        img.data[i] = img.data[i+1] = img.data[i+2] = b; img.data[i+3] = 255
      }
    }
    ctx.putImageData(img, 0, 0)
  }, 5, 8)

  const normalMap = makeCanvasTexture((ctx, size) => {
    const img = ctx.createImageData(size, size)
    for (let y = 0; y < size; y++) {
      for (let x = 0; x < size; x++) {
        const nx = x / size
        const i = (y * size + x) * 4
        let dx = (grain01(x-1,y) - grain01(x+1,y)) * normalMul
        let dy = (grain01(x,y-1) - grain01(x,y+1)) * normalMul
        dx += Math.sin(nx * Math.PI * 64) * (variant === 'titanium' ? 0.06 : 0.085)
        const nz = Math.sqrt(Math.max(0, 1 - dx*dx - dy*dy))
        img.data[i]   = Math.round((dx * 0.5 + 0.5) * 255)
        img.data[i+1] = Math.round((dy * 0.5 + 0.5) * 255)
        img.data[i+2] = Math.round((nz * 0.5 + 0.5) * 255)
        img.data[i+3] = 255
      }
    }
    ctx.putImageData(img, 0, 0)
  }, 5, 8)

  return (_texCache[variant] = { roughnessMap, normalMap })
}

function frameLuminance(hex) { const c = new THREE.Color(hex); return 0.2126*c.r + 0.7152*c.g + 0.0722*c.b }
function frameSaturation(hex) {
  const c = new THREE.Color(hex)
  const max = Math.max(c.r, c.g, c.b), min = Math.min(c.r, c.g, c.b)
  return max <= 1e-6 ? 0 : (max - min) / max
}

function frameMatProps(deviceColor) {
  const lum = frameLuminance(deviceColor), sat = frameSaturation(deviceColor)
  const isDark = lum < 0.3
  const maps = getFrameMaps(isDark ? 'titanium' : 'aluminum')
  if (isDark) return { color: deviceColor, metalness: 0.94, roughness: 0.5, roughnessMap: maps.roughnessMap,
    normalMap: maps.normalMap, normalScale: new THREE.Vector2(0.48, 0.48),
    clearcoat: 0.05, clearcoatRoughness: 0.85, envMapIntensity: 1.25 }
  const starlight = lum > 0.58 && sat < 0.12
  return { color: deviceColor,
    metalness: starlight ? 0.93 : 0.89,
    roughness: Math.min(0.52, starlight ? 0.38 : 0.44 + (1 - lum) * 0.05),
    roughnessMap: maps.roughnessMap, normalMap: maps.normalMap,
    normalScale: new THREE.Vector2(0.4, 0.4),
    clearcoat: 0.055, clearcoatRoughness: 0.72, envMapIntensity: starlight ? 1.52 : 1.24 }
}

// ── Shape helpers (ScreenshotPlane.tsx) ───────────────────────────────────
function roundedRectShape(w, h, r) {
  const s = new THREE.Shape(), x = -w/2, y = -h/2
  s.moveTo(x+r,y); s.lineTo(x+w-r,y); s.quadraticCurveTo(x+w,y,x+w,y+r)
  s.lineTo(x+w,y+h-r); s.quadraticCurveTo(x+w,y+h,x+w-r,y+h)
  s.lineTo(x+r,y+h); s.quadraticCurveTo(x,y+h,x,y+h-r)
  s.lineTo(x,y+r); s.quadraticCurveTo(x,y,x+r,y)
  return s
}
function roundedHolePath(w, h, r) {
  const p = new THREE.Path(), x = -w/2, y = -h/2
  p.moveTo(x+r,y); p.quadraticCurveTo(x,y,x,y+r)
  p.lineTo(x,y+h-r); p.quadraticCurveTo(x,y+h,x+r,y+h)
  p.lineTo(x+w-r,y+h); p.quadraticCurveTo(x+w,y+h,x+w,y+h-r)
  p.lineTo(x+w,y+r); p.quadraticCurveTo(x+w,y,x+w-r,y)
  p.lineTo(x+r,y)
  return p
}
function applyBBoxUVs(geom, w, h) {
  const pos = geom.getAttribute('position'), uv = geom.getAttribute('uv')
  if (!pos || !uv) return
  const pa = pos.array, uva = uv.array, hw = w/2, hh = h/2
  for (let i = 0; i < pa.length; i += 3) {
    const j = (i/3)*2; uva[j] = (pa[i]+hw)/w; uva[j+1] = (pa[i+1]+hh)/h
  }
  uv.needsUpdate = true
}

// ── Camera lens helpers ───────────────────────────────────────────────────
function addLens(parent, pos) {
  const g = new THREE.Group(); g.position.set(...pos)
  const housing = new THREE.Mesh(new THREE.CylinderGeometry(0.56,0.56,0.22,64),
    new THREE.MeshPhysicalMaterial({color:'#0a0b0e',metalness:0.78,roughness:0.45,clearcoat:0.4,clearcoatRoughness:0.35,envMapIntensity:1.1}))
  housing.rotation.x = Math.PI/2; g.add(housing)
  const rim = new THREE.Mesh(new THREE.CylinderGeometry(0.50,0.50,0.025,64),
    new THREE.MeshPhysicalMaterial({color:'#8a8d92',metalness:0.96,roughness:0.22,envMapIntensity:1.5}))
  rim.rotation.x = Math.PI/2; rim.position.z = -0.115; g.add(rim)
  const glass = new THREE.Mesh(new THREE.CircleGeometry(0.44,64),
    new THREE.MeshPhysicalMaterial({color:'#03050c',metalness:0.62,roughness:0.05,clearcoat:1,clearcoatRoughness:0.03,envMapIntensity:1.8,side:THREE.DoubleSide}))
  glass.position.z = -0.131; g.add(glass)
  const pupil = new THREE.Mesh(new THREE.CircleGeometry(0.085,32), new THREE.MeshBasicMaterial({color:'#000',side:THREE.DoubleSide}))
  pupil.position.z = -0.132; g.add(pupil)
  parent.add(g)
}
function addFlash(parent, pos) {
  const g = new THREE.Group(); g.position.set(...pos)
  const h = new THREE.Mesh(new THREE.CylinderGeometry(0.21,0.21,0.06,32),
    new THREE.MeshPhysicalMaterial({color:'#1b1c1f',metalness:0.5,roughness:0.4}))
  h.rotation.x = Math.PI/2; g.add(h)
  const b = new THREE.Mesh(new THREE.CircleGeometry(0.13,32),
    new THREE.MeshPhysicalMaterial({color:'#fff5e0',emissive:'#fff0d8',emissiveIntensity:0.08,metalness:0.2,roughness:0.25,side:THREE.DoubleSide}))
  b.position.z = -0.035; g.add(b); parent.add(g)
}
function addLidar(parent, pos) {
  const g = new THREE.Group(); g.position.set(...pos)
  const h = new THREE.Mesh(new THREE.CylinderGeometry(0.16,0.16,0.05,32),
    new THREE.MeshPhysicalMaterial({color:'#16171a',metalness:0.4,roughness:0.45}))
  h.rotation.x = Math.PI/2; g.add(h)
  const s = new THREE.Mesh(new THREE.CircleGeometry(0.11,32),
    new THREE.MeshPhysicalMaterial({color:'#0a0a0c',metalness:0.3,roughness:0.55,side:THREE.DoubleSide}))
  s.position.z = -0.03; g.add(s); parent.add(g)
}
function addButton(parent, fmp, side, y, length) {
  const depthZ = D*0.56, thickX = 0.076
  const capR = Math.min(depthZ*0.5 - 0.006, (length-0.03)/2)
  const cylLen = Math.max(0.03, length - 2*capR)
  const scaleX = thickX / (2*capR)
  const geom = new THREE.CapsuleGeometry(capR, cylLen, 10, 24)
  geom.scale(scaleX, 1, 1); geom.computeVertexNormals()
  const x = side === 'left' ? -W/2+thickX/2 : W/2-thickX/2
  const mesh = new THREE.Mesh(geom, new THREE.MeshPhysicalMaterial({
    ...fmp, roughness: Math.min(0.92, fmp.roughness*1.08),
    clearcoat: fmp.clearcoat*0.65, clearcoatRoughness: Math.min(0.95, fmp.clearcoatRoughness*1.15),
    envMapIntensity: fmp.envMapIntensity*0.92, polygonOffset:true, polygonOffsetFactor:1, polygonOffsetUnits:1
  }))
  mesh.position.set(x, y, 0); mesh.castShadow = true; parent.add(mesh)
}

// ── Build complete phone ──────────────────────────────────────────────────
function buildPhone(deviceColor, screenshotTex, deviceRotation) {
  const root = new THREE.Group()
  root.rotation.set(...deviceRotation)
  const fmp = frameMatProps(deviceColor)

  // Body
  const bodyGeom = new RoundedBoxGeometry(W, H, D, 8, CORNER)
  const body = new THREE.Mesh(bodyGeom, new THREE.MeshPhysicalMaterial(fmp))
  body.castShadow = true; body.receiveShadow = true; root.add(body)

  // Back panel
  const backShape = roundedRectShape(W-0.04, H-0.04, CORNER-0.02)
  const back = new THREE.Mesh(new THREE.ShapeGeometry(backShape, 64), new THREE.MeshPhysicalMaterial({
    color: deviceColor, metalness:0.18, roughness:0.5, clearcoat:0.55, clearcoatRoughness:0.3, envMapIntensity:1.1,
    polygonOffset:true, polygonOffsetFactor:-1, polygonOffsetUnits:-1
  }))
  back.position.set(0, 0, -D/2-0.008); back.rotation.set(0, Math.PI, 0); root.add(back)

  // Screen platform
  const platform = new THREE.Mesh(
    new RoundedBoxGeometry(SCREEN_W-0.02, SCREEN_H-0.02, SCREEN_PLATFORM_DEPTH, 5, 0.42),
    new THREE.MeshPhysicalMaterial({color:'#050608',metalness:0.12,roughness:0.35,clearcoat:0.65,clearcoatRoughness:0.22,envMapIntensity:0.95})
  )
  platform.position.set(0, 0, SCREEN_PLATFORM_CENTER_Z); root.add(platform)

  // Screenshot plane
  const inset = 0.08, pw = SCREEN_W-inset*2, ph = SCREEN_H-inset*2
  const cornerR = Math.max(0.06, SCREEN_OPENING_CORNER_R - inset)
  const screenGeom = new THREE.ShapeGeometry(roundedRectShape(pw, ph, cornerR), 64)
  applyBBoxUVs(screenGeom, pw, ph)
  if (screenshotTex) {
    screenshotTex.colorSpace = THREE.SRGBColorSpace
    screenshotTex.wrapS = screenshotTex.wrapT = THREE.ClampToEdgeWrapping
    screenshotTex.minFilter = THREE.LinearMipmapLinearFilter
    screenshotTex.magFilter = THREE.LinearFilter
    screenshotTex.generateMipmaps = true
    screenshotTex.needsUpdate = true
  }
  const screenMesh = new THREE.Mesh(screenGeom, new THREE.MeshBasicMaterial({
    color: screenshotTex ? 0xffffff : 0x050505, map: screenshotTex || null,
    toneMapped: false, depthWrite: true, polygonOffset:true, polygonOffsetFactor:-4, polygonOffsetUnits:-4
  }))
  screenMesh.position.set(0, 0, SCREEN_Z); root.add(screenMesh)

  // Bezel ring
  const bezelShape = roundedRectShape(W-0.12, H-0.12, CORNER-0.05)
  bezelShape.holes.push(roundedHolePath(SCREEN_W, SCREEN_H, SCREEN_OPENING_CORNER_R))
  const bezel = new THREE.Mesh(new THREE.ShapeGeometry(bezelShape, 48),
    new THREE.MeshBasicMaterial({color:0x000000, side:THREE.DoubleSide, toneMapped:false}))
  bezel.position.set(0, 0, BEZEL_Z); root.add(bezel)

  // Camera module
  const cam = new THREE.Group(); cam.position.set(-W/2+1.85, H/2-2.4, -D/2)
  const plateau = new THREE.Mesh(new RoundedBoxGeometry(2.85,2.85,0.32,6,0.55),
    new THREE.MeshPhysicalMaterial({color:deviceColor,metalness:0.18,roughness:0.5,clearcoat:0.55,clearcoatRoughness:0.3,envMapIntensity:1.1}))
  plateau.position.set(0,0,-0.16); plateau.castShadow = true; cam.add(plateau)
  const rim = new THREE.Mesh(new RoundedBoxGeometry(2.9,2.9,0.05,6,0.56),
    new THREE.MeshPhysicalMaterial({...fmp, roughness:fmp.roughness*0.85, clearcoat:fmp.clearcoat*1.2}))
  rim.position.set(0,0,-0.025); cam.add(rim)
  addLens(cam, [-0.75,0.75,-0.34]); addLens(cam, [0.75,0.75,-0.34]); addLens(cam, [-0.75,-0.75,-0.34])
  addFlash(cam, [0.75,-0.85,-0.32]); addLidar(cam, [0.18,-0.85,-0.32])
  root.add(cam)

  // Side buttons
  addButton(root, fmp, 'left',  H/2-2.02, 0.62)
  addButton(root, fmp, 'left',  H/2-3.38, 1.05)
  addButton(root, fmp, 'left',  H/2-4.69, 1.05)
  addButton(root, fmp, 'right', H/2-3.45, 1.55)

  // Bottom details
  const bot = new THREE.Group(); const yBot = -H/2-0.0015
  const usbcShape = new THREE.Shape()
  const bw=0.85, bh=0.32, br=bh/2
  usbcShape.moveTo(-bw/2+br,-bh/2); usbcShape.lineTo(bw/2-br,-bh/2)
  usbcShape.absarc(bw/2-br,0,br,-Math.PI/2,Math.PI/2,false)
  usbcShape.lineTo(-bw/2+br,bh/2); usbcShape.absarc(-bw/2+br,0,br,Math.PI/2,-Math.PI/2,false)
  const portMat = new THREE.MeshPhysicalMaterial({color:'#040406',metalness:0.2,roughness:0.6,clearcoat:0.4,clearcoatRoughness:0.4,side:THREE.DoubleSide})
  const usbc = new THREE.Mesh(new THREE.ShapeGeometry(usbcShape,32), portMat)
  usbc.position.set(0,yBot,0); usbc.rotation.x = Math.PI/2; bot.add(usbc)
  const inner = new THREE.Mesh(new THREE.PlaneGeometry(0.62,0.13),
    new THREE.MeshBasicMaterial({color:'#16181c',side:THREE.DoubleSide}))
  inner.position.set(0,yBot-0.0005,0); inner.rotation.x = Math.PI/2; bot.add(inner)
  const dotGeom = new THREE.CircleGeometry(0.045,24)
  const dotMat = new THREE.MeshBasicMaterial({color:'#000',side:THREE.DoubleSide})
  ;[0,1,2,3,4,5].map(i => 1.2+i*0.16).forEach(x => {
    const l = new THREE.Mesh(dotGeom, dotMat); l.position.set(x,yBot,0); l.rotation.x=Math.PI/2; bot.add(l)
    const r = new THREE.Mesh(dotGeom, dotMat); r.position.set(-x,yBot,0); r.rotation.x=Math.PI/2; bot.add(r)
  })
  root.add(bot)
  return root
}

// ── Renderer & env state ──────────────────────────────────────────────────
let _renderer = null
let _envTex = null

async function loadEnv(renderer) {
  if (_envTex) return _envTex
  const pmrem = new THREE.PMREMGenerator(renderer)
  pmrem.compileEquirectangularShader()
  return new Promise((resolve, reject) => {
    new RGBELoader().load('/assets/studio.hdr', hdr => {
      _envTex = pmrem.fromEquirectangular(hdr).texture
      hdr.dispose(); pmrem.dispose()
      resolve(_envTex)
    }, undefined, reject)
  })
}

// ── Main render function ──────────────────────────────────────────────────
window.renderMockup = async function(opts) {
  const { imageDataUrl, deviceColor = '#1a1a1a', bgColor = '#0a0a0a',
    width = 1440, height = 2880, deviceRotation = [0, 0, 0], zoom = 1 } = opts

  const canvas = document.getElementById('c')
  canvas.width = width; canvas.height = height

  if (!_renderer) {
    _renderer = new THREE.WebGLRenderer({ canvas, antialias: true, preserveDrawingBuffer: true })
    _renderer.shadowMap.enabled = true
    _renderer.shadowMap.type = THREE.PCFSoftShadowMap
    _renderer.toneMapping = THREE.ACESFilmicToneMapping
    _renderer.toneMappingExposure = 0.94
    _renderer.outputColorSpace = THREE.SRGBColorSpace
  }
  _renderer.setSize(width, height, false)

  const scene = new THREE.Scene()
  scene.background = new THREE.Color(bgColor)

  const camera = new THREE.PerspectiveCamera(28, width / height, 0.1, 100)
  const cameraZ = 28 / Math.max(0.3, Math.min(3, zoom))
  camera.position.set(0, 0, cameraZ)

  // Lights (Scene.tsx)
  scene.add(new THREE.AmbientLight(0xffffff, 0.2))
  const hemi = new THREE.HemisphereLight('#f2f4ff', '#1a1c22', 0.35)
  hemi.position.set(0,1,0); scene.add(hemi)
  const dirMain = new THREE.DirectionalLight('#fffaf4', 1.05)
  dirMain.position.set(9,11,7); dirMain.castShadow = true
  dirMain.shadow.mapSize.set(2048,2048)
  dirMain.shadow.camera.far = 40; dirMain.shadow.camera.near = 4
  dirMain.shadow.bias = -0.00015; scene.add(dirMain)
  const dirFill = new THREE.DirectionalLight('#c8d8ff', 0.38); dirFill.position.set(-11,2,-4); scene.add(dirFill)
  const dirBack = new THREE.DirectionalLight('#ffffff', 0.42); dirBack.position.set(2,-4,-14); scene.add(dirBack)
  const pt = new THREE.PointLight('#fff5eb', 0.22); pt.position.set(0,7,6); scene.add(pt)

  // Ground shadow (ContactShadows approximation)
  const ground = new THREE.Mesh(new THREE.PlaneGeometry(30,30), new THREE.ShadowMaterial({opacity:0.55}))
  ground.rotation.x = -Math.PI/2; ground.position.y = -9; ground.receiveShadow = true; scene.add(ground)

  // HDRI
  try {
    const env = await loadEnv(_renderer)
    scene.environment = env
    scene.environmentIntensity = 0.74
  } catch(e) { console.warn('HDRI skip:', e.message) }

  // Screenshot texture
  let tex = null
  if (imageDataUrl) {
    tex = await new Promise(resolve => {
      new THREE.TextureLoader().load(imageDataUrl, resolve, undefined, () => resolve(null))
    })
  }

  // Phone
  scene.add(buildPhone(deviceColor, tex, deviceRotation))

  _renderer.render(scene, camera)
  const dataUrl = canvas.toDataURL('image/png')

  // Dispose scene (keep renderer & env)
  scene.traverse(obj => {
    obj.geometry?.dispose()
    if (obj.material) {
      const mats = Array.isArray(obj.material) ? obj.material : [obj.material]
      mats.forEach(m => { m.map?.dispose(); m.roughnessMap?.dispose(); m.normalMap?.dispose(); m.dispose() })
    }
  })

  return dataUrl
}

window.__rendererReady = true
</script>
</body>
</html>
